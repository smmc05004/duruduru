<html>

    body { margin:0; font-family:'Gothic A1',sans-serif; }
    a { color:#ff5436; } a:hover { color:#c93a20; }

<div style="width:390px; min-height:844px; background:#fffdf7; color:#111; padding-bottom:40px">

        <h2 style="margin:0; font-family:'Black Han Sans',sans-serif; font-size:42px; line-height:1; letter-spacing:-.03em">경주</h2>
        <div style="text-align:right">

        <span style="padding:5px 10px; background:#ffe94d; font-size:11px; font-weight:700">축제 기간</span>
        <span style="padding:5px 10px; border:1.5px solid #111; font-size:11px; font-weight:700">현지 29시간</span>
      </div>
      <p style="margin:14px 0 0; font-size:14px; line-height:1.65; color:#3d3d38">천년 고도의 유적과 한옥 골목. 유적 네 곳이 하루 반 안에 들어갑니다.</p>
    </div>

    <div style="padding:22px 20px; border-top:1px solid #111">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px">
        <h2 style="margin:0; font-family:'Black Han Sans',sans-serif; font-size:42px; line-height:1; letter-spacing:-.03em">공주</h2>
        <div style="text-align:right">
          <p style="margin:0; font-size:10px; font-weight:700; letter-spacing:.1em; color:#8b8b84">왕복</p>
          <p style="margin:2px 0 0; font-family:'Black Han Sans',sans-serif; font-size:26px; line-height:1">3:12</p>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:14px">
        <span style="padding:5px 10px; background:#111; color:#fffdf7; font-size:11px; font-weight:700">역사</span>
        <span style="padding:5px 10px; background:#ffe94d; font-size:11px; font-weight:700">축제 기간</span>
        <span style="padding:5px 10px; border:1.5px solid #111; font-size:11px; font-weight:700">현지 33시간</span>
      </div>
      <p style="margin:14px 0 0; font-size:14px; line-height:1.65; color:#3d3d38">가장 가깝습니다. 이동이 짧아 남는 시간이 가장 많습니다.</p>
    </div>

    <div style="padding:22px 20px; border-top:1px solid #111; border-bottom:3px solid #111">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px">
        <h2 style="margin:0; font-family:'Black Han Sans',sans-serif; font-size:42px; line-height:1; letter-spacing:-.03em; color:#8b8b84">강릉</h2>
        <div style="text-align:right">
          <p style="margin:0; font-size:10px; font-weight:700; letter-spacing:.1em; color:#8b8b84">왕복</p>
          <p style="margin:2px 0 0; font-family:'Black Han Sans',sans-serif; font-size:26px; line-height:1; color:#8b8b84">5:36</p>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:14px">
        <span style="padding:5px 10px; border:1.5px solid #c4c4bc; color:#8b8b84; font-size:11px; font-weight:700">자연 · 미식</span>
      </div>
      <p style="margin:14px 0 0; font-size:14px; line-height:1.65; color:#8b8b84">시간은 되지만 역사 취향과는 거리가 있습니다.</p>
    </div>

  </div>

  <p style="margin:20px 20px 0; font-size:11px; line-height:1.7; color:#8b8b84">이동시간은 평균값 기반 추정치입니다.</p>

</div>
