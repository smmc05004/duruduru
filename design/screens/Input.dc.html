<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gothic+A1:wght@500;600;700;800&family=Jua&display=swap">
  <style>
    body { margin:0; font-family:'Gothic A1',sans-serif; }
    a { color:#4a6b2f; } a:hover { color:#2e441d; }
  </style>
</helmet>
<div style="width:390px; min-height:928px; color:#2b2a1d; background:#efe9d5; background-image:radial-gradient(#d9d0b3 1px, transparent 1px); background-size:16px 16px; padding-bottom:40px">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:24px 22px 0">
    <span style="font-family:'Jua',sans-serif; font-size:24px; color:#3f6b2b">두루두루</span>
    <span style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:#5a5442">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5a5442" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="7.2"></circle><path d="M10 6.2V10l2.6 1.8"></path></svg>
      지원 조건 2026-08-30 기준
    </span>
  </div>

  <p style="margin:18px 22px 0; font-family:'Jua',sans-serif; font-size:25px; line-height:1.42">쓸 수 있는 시간을<br>알려주면 갈 곳부터 골라줄게요</p>

  <div style="display:flex; flex-direction:column; gap:16px; padding:22px 18px 0">

    <div style="padding:20px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4">
      <label style="display:block; font-size:12px; font-weight:700; color:#3d3a2c">어디서 출발해요?</label>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px; min-height:48px; padding:0 14px; background:#fdfcf6; border:2px solid #33301f">
        <span style="font-size:15px; font-weight:600; color:#6a6450">출발지를 골라 주세요</span>
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#33301f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8L10 12.5 14.5 8"></path></svg>
      </div>
      <p style="margin:8px 0 0; font-size:11px; font-weight:500; line-height:1.7; color:#6a6450">지금은 주요 도시 단위로만 고를 수 있어요.</p>
    </div>

    <div style="padding:20px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4">
      <label style="display:block; font-size:12px; font-weight:700; color:#3d3a2c">언제 나가서 언제까지 돌아와요?</label>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:9px">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px; padding:0 14px; background:#fdfcf6; border:2px solid #33301f">
          <span style="font-size:11px; font-weight:600; color:#5a5442">출발</span>
          <span style="font-size:15px; font-weight:600; color:#6a6450">연도-월-일 --:--</span>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px; padding:0 14px; background:#fdfcf6; border:2px solid #33301f">
          <span style="font-size:11px; font-weight:600; color:#5a5442">복귀 가능</span>
          <span style="font-size:15px; font-weight:600; color:#6a6450">연도-월-일 --:--</span>
        </div>
      </div>
    </div>

    <div style="padding:20px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4">
      <label style="display:block; font-size:12px; font-weight:700; color:#3d3a2c">무엇으로 이동해요?</label>
      <div style="display:flex; gap:0; margin-top:9px; border:2px solid #33301f; background:#fdfcf6">
        <div style="flex-grow:1; display:flex; align-items:center; justify-content:center; gap:7px; min-height:46px; background:#4a6b2f; color:#f6f2e5; font-size:14px; font-weight:700">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#f6f2e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h14M4.5 12.5V9.2l1.8-3.4h7.4l1.8 3.4v3.3"></path><circle cx="6.6" cy="14.4" r="1.4"></circle><circle cx="13.4" cy="14.4" r="1.4"></circle></svg>
          자차
        </div>
        <div style="flex-grow:1; display:flex; align-items:center; justify-content:center; min-height:46px; background:#f4f0e2; color:#6a6450; font-size:14px; font-weight:600; border-left:2px solid #a8a081">대중교통</div>
      </div>
      <p style="margin:8px 0 0; font-size:11px; font-weight:500; line-height:1.7; color:#6a6450">대중교통은 아직 준비 중이라 고를 수 없어요.</p>
    </div>

    <div style="padding:20px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4">
      <label style="display:block; font-size:12px; font-weight:700; color:#3d3a2c">어떤 걸 좋아해요? <span style="font-weight:600; color:#6a6450">· 안 골라도 괜찮아요</span></label>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:11px">
        <span style="display:inline-flex; align-items:center; min-height:44px; padding:0 16px; background:#fdfcf6; border:1.5px solid #4a6b2f; border-radius:99px; font-size:13px; font-weight:600; color:#3f6b2b">역사</span>
        <span style="display:inline-flex; align-items:center; min-height:44px; padding:0 16px; background:#fdfcf6; border:1.5px solid #4a6b2f; border-radius:99px; font-size:13px; font-weight:600; color:#3f6b2b">자연</span>
        <span style="display:inline-flex; align-items:center; min-height:44px; padding:0 16px; background:#fdfcf6; border:1.5px solid #4a6b2f; border-radius:99px; font-size:13px; font-weight:600; color:#3f6b2b">문화</span>
        <span style="display:inline-flex; align-items:center; min-height:44px; padding:0 16px; background:#fdfcf6; border:1.5px solid #4a6b2f; border-radius:99px; font-size:13px; font-weight:600; color:#3f6b2b">미식</span>
      </div>
    </div>

  </div>

  <div style="padding:24px 18px 0">
    <div style="display:flex; align-items:center; justify-content:center; min-height:56px; background:#4a6b2f; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4; color:#f6f2e5; font-family:'Jua',sans-serif; font-size:19px">갈 수 있는 곳 찾기</div>
  </div>

  <p style="margin:20px 22px 0; font-size:11px; font-weight:500; line-height:1.7; color:#6a6450">이동시간은 평균값 기반 추정치예요. 실시간 교통 상황은 반영하지 않아요.</p>

</div>
</x-dc>
</body>
</html>
