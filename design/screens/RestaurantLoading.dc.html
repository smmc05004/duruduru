<div style="width:390px; min-height:900px; color:#2b2a1d; background:#efe9d5; background-image:radial-gradient(#d9d0b3 1px, transparent 1px); background-size:16px 16px; padding-bottom:40px">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:24px 22px 0">

      <h1 style="margin:0; font-family:'Jua',sans-serif; font-size:34px; line-height:1.15">경주</h1>

      <span style="padding:6px 11px; border:1.5px solid #4a6b2f; border-radius:99px; font-size:12px; font-weight:600; color:#3f6b2b">9/12 08:00 → 9/13 20:00</span>
      <span style="padding:6px 11px; background:#e0b743; border-radius:99px; font-size:12px; font-weight:700; color:#4a3708">역사</span>
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:11px; margin:16px 18px 0; padding:15px; background:#e6efd8; border:2px solid #4a6b2f">
    <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="#3f6b2b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6.5 3v6a2 2 0 0 0 4 0V3M8.5 11v6M14 3c1.4 1.2 1.4 4.4 0 5.6V17"></path></svg>
    <div>
      <p style="margin:0; font-size:13px; font-weight:700; color:#3f6b2b">선택한 지역의 음식점을 불러오고 있어요</p>
      <p style="margin:4px 0 0; font-size:11px; font-weight:600; line-height:1.6; color:#3f6b2b">경주 음식점 목록을 받아 점심·저녁을 채우는 중이에요.</p>
    </div>
  </div>

  <p style="margin:20px 22px 0; font-family:'Jua',sans-serif; font-size:19px">곧 1박 2일 계획이 완성돼요</p>

  <div style="display:flex; flex-direction:column; gap:12px; padding:12px 18px 0">

    <div style="display:flex; gap:12px">

        <span style="flex-grow:1; width:2px; margin-top:8px; background:#c3b998"></span>
      </div>

        <span style="font-size:11px; font-weight:700; color:#5a5442">이동</span>
        <p style="margin:8px 0 0; font-size:15px; font-weight:700">서울특별시에서 경주로 출발</p>
        <p style="margin:6px 0 0; font-size:12px; font-weight:500; color:#5a5442">일반 예상 이동 3.3시간 · 자차 기준</p>
      </div>
    </div>

    <div style="display:flex; gap:12px">
      <div style="display:flex; flex-direction:column; align-items:center; width:52px; flex-shrink:0">
        <span style="width:38px; height:12px; background:#ded8c2"></span>
        <span style="flex-grow:1; width:2px; margin-top:8px; background:#c3b998"></span>
      </div>
      <div style="flex-grow:1; padding:15px 16px; background:#fbf8ee; border:2px solid #33301f; box-shadow:4px 4px 0 #cfc5a4; border-left:6px solid #e0b743">
        <div style="display:flex; align-items:center; gap:7px">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#7a5710" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3v6a2 2 0 0 0 4 0V3M8.5 11v6M14 3c1.4 1.2 1.4 4.4 0 5.6V17"></path></svg>
          <span style="font-size:11px; font-weight:700; color:#7a5710">점심</span>
        </div>
        <div style="width:150px; height:15px; margin-top:9px; background:#ded8c2"></div>
        <div style="width:96px; height:12px; margin-top:8px; background:#ded8c2"></div>
      </div>
    </div>

    <div style="display:flex; gap:12px">
      <div style="display:flex; flex-direction:column; align-items:center; width:52px; flex-shrink:0">
        <span style="width:38px; height:12px; background:#ded8c2"></span>
        <span style="flex-grow:1; width:2px; margin-top:8px; background:#c3b998"></span>
      </div>
      <div style="flex-grow:1; padding:15px 16px; background:#fbf8ee; border:2px solid #33301f; box-shadow:4px 4px 0 #cfc5a4; border-left:6px solid #6c9b4a">
        <div style="display:flex; align-items:center; gap:7px">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#3f6b2b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16.5h14M5.5 16.5V8.2L10 4.5l4.5 3.7v8.3"></path><path d="M8.4 16.5v-4.2h3.2v4.2"></path></svg>
          <span style="font-size:11px; font-weight:700; color:#3f6b2b">방문 · 역사</span>
        </div>
        <p style="margin:9px 0 0; font-size:15px; font-weight:700">천마총(대릉원)</p>
        <p style="margin:6px 0 0; font-size:12px; font-weight:500; color:#5a5442">체류 1시간</p>
      </div>
    </div>

    <div style="display:flex; gap:12px">
      <div style="display:flex; flex-direction:column; align-items:center; width:52px; flex-shrink:0">
        <span style="width:38px; height:12px; background:#ded8c2"></span>
      </div>
      <div style="flex-grow:1; padding:15px 16px; background:#fbf8ee; border:2px solid #33301f; box-shadow:4px 4px 0 #cfc5a4; border-left:6px solid #e0b743">
        <div style="display:flex; align-items:center; gap:7px">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#7a5710" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3v6a2 2 0 0 0 4 0V3M8.5 11v6M14 3c1.4 1.2 1.4 4.4 0 5.6V17"></path></svg>
          <span style="font-size:11px; font-weight:700; color:#7a5710">저녁</span>

  </div>

  <div style="padding:22px 18px 0">
    <div style="display:flex; align-items:center; justify-content:center; min-height:52px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4; font-size:15px; font-weight:700; color:#2b2a1d">다른 지역 보기</div>
  </div>

  <p style="margin:20px 22px 0; font-size:11px; font-weight:500; line-height:1.7; color:#6a6450">음식점은 선택한 한 지역에서만 목록 기본 정보를 조회해요. 운영시간·메뉴는 나중에 음식점을 열 때 확인해요.</p>
