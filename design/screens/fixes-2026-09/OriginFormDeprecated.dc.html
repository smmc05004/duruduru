<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gothic+A1:wght@500;600;700;800&family=Jua&display=swap">
  <style>
    :root {
      --paper: #efe9d5; --paper-dot: #d9d0b3; --card-muted: #f4f0e2;
      --ink: #2b2a1d; --ink-muted: #5a5442; --ink-faint: #6a6450;
      --line-dashed: #a8a081;
      --font-title: 'Jua', system-ui, 'Apple SD Gothic Neo', sans-serif;
      --font-body: 'Gothic A1', system-ui, 'Apple SD Gothic Neo', sans-serif;
    }
    body { margin: 0; font-family: var(--font-body); color: var(--ink); }
    .frame {
      width: 390px; min-height: 260px; background: var(--paper);
      background-image: radial-gradient(var(--paper-dot) 1px, transparent 1px);
      background-size: 16px 16px; padding: 24px 20px; display: flex; align-items: center;
    }
    .card {
      width: 100%; padding: 22px 20px; background: var(--card-muted);
      border: 2px dashed var(--line-dashed);
    }
    .card h2 { margin: 0; font-family: var(--font-title); font-weight: 400; font-size: 19px; color: var(--ink-muted); }
    .card p { margin: 10px 0 0; font-size: 12px; font-weight: 500; line-height: 1.7; color: var(--ink-faint); }
  </style>
</helmet>
<div class="frame">
  <div class="card">
    <h2>폐기 예정 — 디자인 불필요</h2>
    <p>출발지 세그먼티드 선택과 OriginSearch 표준 지역 검색을 곧 제거할 예정이다(제품 판단, 2026-09-15). 이 라운드에서는 출발지 폼을 다시 디자인하지 않는다.</p>
  </div>
</div>
</x-dc>
</body>
</html>
