<!doctype html>
<html>
<head>

</head>
<body>
<x-dc>

  <style>
    body { margin:0; font-family:'Gothic A1',sans-serif; }

<div style="width:390px; min-height:844px; color:#2b2a1d; background:#efe9d5; background-image:radial-gradient(#d9d0b3 1px, transparent 1px); background-size:16px 16px; padding-bottom:40px">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:24px 22px 0">

  </div>

  <div style="margin:20px 18px 0; padding:20px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4">
    <p style="margin:0; font-family:'Jua',sans-serif; font-size:25px; line-height:1.42; color:#2b2a1d">서울에서 출발해서<br>다시 돌아올 수 있는 곳</p>
    <div style="display:flex; flex-wrap:wrap; gap:7px; margin-top:15px">
      <span style="padding:6px 11px; border:1.5px solid #4a6b2f; border-radius:99px; font-size:12px; font-weight:600; color:#3f6b2b">9/12 08:00 출발</span>
      <span style="padding:6px 11px; border:1.5px solid #4a6b2f; border-radius:99px; font-size:12px; font-weight:600; color:#3f6b2b">9/13 20:00 복귀</span>
      <span style="padding:6px 11px; border:1.5px solid #4a6b2f; border-radius:99px; font-size:12px; font-weight:600; color:#3f6b2b">자차</span>
      <span style="padding:6px 11px; background:#e0b743; border-radius:99px; font-size:12px; font-weight:700; color:#4a3708">역사</span>
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:10px; margin:18px 18px 0; padding:14px 15px; background:#e6efd8; border:2px solid #4a6b2f">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#3f6b2b" stroke-width="1.9" stroke-linecap="round" style="flex-shrink:0"><path d="M10 2.8a7.2 7.2 0 1 1-6.9 5.1"></path></svg>

  </div>

  <div style="display:flex; flex-direction:column; gap:16px; padding:18px 18px 0">
    <div style="padding:20px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4">
      <div style="display:flex; align-items:center; justify-content:space-between">
        <div style="width:118px; height:32px; background:#ded8c2"></div>
        <div style="width:58px; height:12px; background:#ded8c2"></div>
      </div>
      <div style="height:10px; margin-top:18px; border-radius:99px; background:#ded8c2"></div>
      <div style="display:flex; gap:8px; margin-top:9px">
        <div style="width:54px; height:11px; background:#ded8c2"></div>
        <div style="flex-grow:1"></div>
        <div style="width:54px; height:11px; background:#ded8c2"></div>
      </div>
      <div style="height:12px; margin-top:18px; background:#ded8c2"></div>
      <div style="width:72%; height:12px; margin-top:8px; background:#ded8c2"></div>
      <div style="display:flex; gap:6px; margin-top:16px">
        <div style="width:58px; height:22px; background:#ded8c2"></div>
        <div style="width:64px; height:22px; background:#ded8c2"></div>
        <div style="width:52px; height:22px; background:#ded8c2"></div>
      </div>
    </div>

    <div style="padding:20px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4">
      <div style="display:flex; align-items:center; justify-content:space-between">
        <div style="width:96px; height:32px; background:#ded8c2"></div>
        <div style="width:58px; height:12px; background:#ded8c2"></div>
      </div>
      <div style="height:10px; margin-top:18px; border-radius:99px; background:#ded8c2"></div>
      <div style="height:12px; margin-top:18px; background:#ded8c2"></div>
      <div style="width:60%; height:12px; margin-top:8px; background:#ded8c2"></div>
    </div>
  </div>

  <div style="padding:24px 18px 0">
    <div style="display:flex; align-items:center; justify-content:center; min-height:52px; background:#fbf8ee; border:2px solid #33301f; box-shadow:5px 5px 0 #cfc5a4; font-size:15px; font-weight:700; color:#2b2a1d">조건 수정하기</div>
  </div>

  <p style="margin:20px 22px 0; font-size:11px; font-weight:500; line-height:1.7; color:#6a6450">이동시간은 평균값 기반 추정치예요. 실시간 교통 상황은 반영하지 않아요.</p>

</div>
</x-dc>
</body>
</html>
